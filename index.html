<title>CLIENT WARS</title>
<style>
:root{--bg:#0d0b18;--panel:#171329;--panel2:#20183a;--line:#392966;--purple:#a855f7;--cyan:#22d3ee;--text:#f7f3ff;--muted:#aaa0c8;--gold:#facc15;--good:#34d399;--danger:#fb7185}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#25134b 0,transparent 36%),radial-gradient(ellipse at 100% 20%,#092b40 0,transparent 30%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}.app{max-width:1180px;margin:auto;padding:22px 18px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.brand{font-weight:1000;letter-spacing:-1.5px;font-size:clamp(25px,4vw,38px);line-height:1}.brand span{color:#b66aff;text-shadow:0 0 22px #8b5cf6}.tag{color:var(--muted);font-size:12px;margin-top:6px}.topright{display:flex;gap:8px;align-items:center}.pill,.btn{border:1px solid var(--line);background:#1a1530;border-radius:13px;padding:10px 14px}.pill{font-size:12px;color:var(--muted)}.btn:hover{filter:brightness(1.2);transform:translateY(-1px)}.primary{background:linear-gradient(110deg,#8b2cf5,#2563eb,#06b6d4);border:0;box-shadow:0 7px 24px #7028d755;font-weight:800}.ghost{background:#21183b}.danger{color:#fecdd3;border-color:#713047}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0 18px;padding-bottom:4px}.tab{white-space:nowrap;padding:11px 16px;border-radius:12px;background:#151126;border:1px solid #30234e;color:var(--muted);font-weight:700}.tab.active{background:linear-gradient(110deg,#51218c,#173f62);border-color:#8751d4;color:white}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.panel{background:linear-gradient(145deg,#1b1530ee,#111020f2);border:1px solid #38285f;border-radius:20px;padding:18px;box-shadow:0 15px 50px #0004}.panel h2,.panel h3{margin:0 0 13px}.muted{color:var(--muted)}.small{font-size:12px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center;background:linear-gradient(110deg,#25144a,#122e48);border:1px solid #6841a1;border-radius:20px;padding:20px;margin-bottom:16px}.hero h1{font-size:clamp(24px,4vw,36px);margin:0}.hero p{margin:7px 0 0;color:#c6b9e6}.mascot{font-size:54px;filter:drop-shadow(0 0 15px #a855f7)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{background:#211a3b;border:1px solid #3c2a66;border-radius:15px;padding:13px}.stat b{display:block;font-size:28px}.stat span{font-size:12px;color:var(--muted)}.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cat{background:#17142a;border:1px solid #332750;border-radius:15px;padding:13px;display:flex;align-items:center;gap:10px}.catemoji{font-size:25px}.catname{font-weight:700;flex:1;font-size:14px}.count{font-size:22px;font-weight:900;min-width:28px;text-align:center}.plus,.minus{width:32px;height:32px;border-radius:10px;font-size:20px;font-weight:900}.plus{background:linear-gradient(135deg,#7c3aed,#2563eb)}.minus{background:#302744;color:#d8cbed}.playerrow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #38295b;border-radius:15px;background:#171329;margin:9px 0}.avatar{width:48px;height:48px;border-radius:15px;background:#2b2050;display:grid;place-items:center;font-size:28px;border:1px solid #6843a0}.playerinfo{flex:1}.playerinfo b{display:block}.score{font-size:25px;font-weight:950}.bar{height:9px;background:#31274a;border-radius:20px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#a855f7,#22d3ee);border-radius:20px}.activity{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #302545}.activity:last-child{border:0}.activity .aicon{font-size:19px}.activity .atxt{flex:1}.badge{display:inline-block;border:1px solid #624391;background:#2c1d48;border-radius:20px;padding:4px 9px;font-size:11px;color:#e7d5ff;margin:3px}.achievement{display:flex;gap:10px;align-items:center;background:#171329;border:1px solid #38295b;padding:11px;border-radius:13px;margin:8px 0}.achievement .medal{font-size:25px}.achievement b{display:block}.profileform{display:grid;gap:12px;max-width:520px}.field{display:grid;gap:6px}.field input{background:#100e1d;border:1px solid #4a3672;color:white;padding:12px;border-radius:12px;outline:none}.avatars{display:flex;flex-wrap:wrap;gap:8px}.avpick{font-size:27px;background:#201a37;border:1px solid #40315f;border-radius:12px;padding:8px}.avpick.selected{border:2px solid #c084fc;background:#39215f}.notice{border:1px solid #6b4b25;background:#302314;color:#fce7b2;padding:12px;border-radius:12px;font-size:13px;margin:12px 0}.hidden{display:none!important}.foot{text-align:center;color:#817899;font-size:11px;margin-top:24px}.modalback{position:fixed;inset:0;background:#05040bd9;display:grid;place-items:center;padding:16px;z-index:9}.modal{width:min(580px,100%);max-height:90vh;overflow:auto;background:#171329;border:1px solid #6846a0;border-radius:20px;padding:20px;box-shadow:0 25px 90px #000b}.modal h2{margin-top:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}.winner{font-size:32px;text-align:center;color:var(--gold);font-weight:1000;margin:15px 0}
@media(max-width:760px){body{padding-bottom:78px}.tabs{position:fixed;z-index:8;bottom:0;left:0;right:0;margin:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#100d20f5;border-top:1px solid #392966;backdrop-filter:blur(14px);justify-content:space-around}.tab{flex:1;text-align:center;padding:12px 7px;font-size:12px}.grid{grid-template-columns:1fr}.app{padding:16px 12px 35px}.hero{padding:15px}.cats{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:10px}.stat b{font-size:23px}.top{align-items:flex-start}.topright{flex-direction:column;align-items:flex-end}.panel{padding:14px}}

:root{--pink:#fb7acb;--lime:#bef264;--gold:#ffd166}
body{background:radial-gradient(ellipse at 12% 5%,#48216c 0,transparent 34%),radial-gradient(ellipse at 90% 12%,#104b61 0,transparent 32%),#0b0916}
.panel{border-radius:24px;background:linear-gradient(145deg,#211638f2,#11101ff5);border-color:#513875;box-shadow:0 18px 55px #0005,inset 0 1px #ffffff0b}
.hero{position:relative;overflow:hidden;border-radius:25px;background:linear-gradient(115deg,#44206c,#163b59 72%,#17485a);border-color:#9360cb;box-shadow:0 15px 45px #7c3aed25}
.hero:after{content:"🐾 ✦ 🐾";position:absolute;right:100px;bottom:-8px;font-size:34px;opacity:.22;letter-spacing:12px;transform:rotate(-12deg);pointer-events:none}
.mascot{font-size:64px;filter:drop-shadow(0 0 18px #d879ff);animation:floaty 3.5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
.cat,.stat,.achievement,.playerrow{border-radius:18px}.cat{background:linear-gradient(135deg,#211a39,#17142a);border-color:#4b3671;transition:.18s}.cat:hover{transform:translateY(-2px);border-color:#a879ec;box-shadow:0 8px 22px #8b5cf633}
.catemoji{font-size:29px;filter:drop-shadow(0 2px 5px #0008)}.plus{background:linear-gradient(135deg,#a855f7,#ec4899);box-shadow:0 4px 12px #a855f744}
.stat{background:linear-gradient(145deg,#2a1e48,#17253b);border-color:#4a3672}.stat b{background:linear-gradient(90deg,#fff,#d9b8ff 65%,#83eaff);background-clip:text;color:transparent}
.tab.active{background:linear-gradient(110deg,#7c3aed,#be3a9d,#087f9e);box-shadow:0 5px 18px #8b5cf655}
.daily-card{position:relative;overflow:hidden;background:linear-gradient(115deg,#30204d,#173b4c);border:1px solid #7952a8;border-radius:21px;padding:17px;margin:0 0 16px}.daily-card:after{content:"🐈‍⬛";position:absolute;right:15px;bottom:-12px;font-size:78px;opacity:.22;pointer-events:none}
.daily-head{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px}.daily-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}.daily-mini{background:#0f1027a8;border:1px solid #ffffff18;border-radius:14px;padding:10px}.daily-mini b{display:block;font-size:23px}.daily-mini span{font-size:11px;color:#c8b9e4}
.mission{display:flex;align-items:center;gap:11px;padding:12px;background:#171329;border:1px solid #493466;border-radius:15px;margin:9px 0}.mission .memoji{font-size:26px}.mission .mtext{flex:1}.mission b{display:block}.mission small{color:var(--muted)}.mission .done{color:#bef264;font-weight:900}.paw-divider{color:#d8a6ff;letter-spacing:5px;font-size:12px;margin:8px 0}
@media(max-width:760px){.daily-grid{grid-template-columns:repeat(3,1fr)}.daily-card{padding:14px}.hero:after{right:55px}.mascot{font-size:50px}}</style>

<body><div class="app">
<header class="top"><div><div class="brand">CLIENT <span>WARS</span> ⚔️</div><div class="tag">До 10 игроков. Одна общая арена. Бесконечные клиенты.</div></div><div class="topright"><span class="pill" id="syncStatus">● Локальный режим</span><button class="btn ghost" id="settingsBtn">⚙️</button></div></header>
<nav class="tabs"><button class="tab active" data-tab="home">🏠 Моя статистика</button><button class="tab" data-tab="battle">⚔️ Батл</button><button class="tab" data-tab="achievements">🏆 Достижения</button><button class="tab" data-tab="history">📜 История</button></nav>
<main id="main"></main>
<div class="foot">CLIENT WARS · СДЕЛАНО ДЛЯ РАБОЧЕГО УГАРА · НЕ ПРИНИМАТЬ СЛИШКОМ СЕРЬЁЗНО 😎</div></div>
<div id="modalRoot"></div>
<script>
const CATS=[
 ['ask','🙋','Я просто спросить'],['thanks','🤝','Спасибо'],['photo','📸','Фотографы'],
 ['ignore','🚫','Игнорщики'],['online','🛒','Спасибо за консультацию, купим в интернете'],['dog','🐶','Вот такая хуйня, собачка']
], AVATARS=['😎','🐱','🐶','🦆','🐼','🦝','🦈','👽','🤡','🐸','🦊','🐙'];
const KEY='cw-v1';
// Общая конфигурация комнаты: коллегам не нужно вводить настройки на каждом устройстве.
const SUPABASE_URL='https://ayzmyqlpviiuvhfrwzwo.supabase.co';
const SUPABASE_KEY='sb_publishable_yhYBo5TAtAs1zGbQ1JvJdQ_mxjARBZz';
const DEFAULT_ROOM='client-wars';
if(!localStorage.getItem('cw-url'))localStorage.setItem('cw-url',SUPABASE_URL);
if(!localStorage.getItem('cw-key'))localStorage.setItem('cw-key',SUPABASE_KEY);
if(!localStorage.getItem('cw-room'))localStorage.setItem('cw-room',DEFAULT_ROOM);
let state=load(), currentTab='home', cloud=null, channel=null, chosenAvatar=AVATARS[0];
function blank(){return {players:[],history:[]}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||blank()}catch{return blank()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function me(){let id=localStorage.getItem('cw-player');return state.players.find(p=>p.id===id)}
function total(p){return Object.values(p.counts||{}).reduce((a,b)=>a+b,0)}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addHistory(player,cat,delta){state.history.unshift({id:Date.now()+Math.random(),player:player.name,avatar:player.avatar,cat:cat?.[2]||'профиль',delta,time:Date.now()});state.history=state.history.slice(0,100)}
function dayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ensureDaily(p){if(!p.dailyCounts)p.dailyCounts={};if(!p.dailyCounts[dayKey()])p.dailyCounts[dayKey()]={};return p.dailyCounts[dayKey()]}
function dailyTotal(p){return Object.values(ensureDaily(p)).reduce((a,b)=>a+(Number(b)||0),0)}
function weeklyTotal(p){let n=0;for(let i=0;i<7;i++){let d=new Date();d.setDate(d.getDate()-i);let k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');n+=Object.values((p.dailyCounts||{})[k]||{}).reduce((a,b)=>a+(Number(b)||0),0)}return n}
function dailyMissions(p){const all=[['🐾','Поймать 3 клиентов','Добавь любых трёх клиентов',3,dailyTotal(p)],['📸','Фотоохота','Зафиксируй 1 фотографа',1,ensureDaily(p).photo||0],['🤝','Доброе слово','Собери 2 «Спасибо»',2,ensureDaily(p).thanks||0],['🛒','Онлайн-рейд','Встреть 1 интернет-покупателя',1,ensureDaily(p).online||0],['🙈','Терпение джедая','Переживи 2 игнора',2,ensureDaily(p).ignore||0],['🐶','Собачий патруль','Добавь случай с собачкой',1,ensureDaily(p).dog||0]];const seed=Number(dayKey().replaceAll('-',''));return [all[seed%6],all[(seed+2)%6],all[(seed+4)%6]].map(x=>({...x,done:x[4]>=x[3]}))}
function dailyPanel(p){const d=dailyTotal(p),w=weeklyTotal(p),m=dailyMissions(p),done=m.filter(x=>x.done).length;return `<section class="daily-card"><div class="daily-head">🌈 ДЕНЬ В CLIENT WARS <span class="badge">${new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</span></div><div class="daily-grid"><div class="daily-mini"><b>${d}</b><span>Сегодня</span></div><div class="daily-mini"><b>${w}</b><span>За 7 дней</span></div><div class="daily-mini"><b>${done}/3</b><span>Миссии дня</span></div></div><div class="paw-divider">🐾 ━━━━━━━━━━━ 🐾</div><b>🎯 Задания на сегодня</b>${m.map(x=>`<div class="mission"><span class="memoji">${x[0]}</span><div class="mtext"><b>${x[1]}</b><small>${x[2]} · ${Math.min(x[4],x[3])}/${x[3]}</small></div><span class="${x.done?'done':'badge'}">${x.done?'✓ ГОТОВО':'В ПРОЦЕССЕ'}</span></div>`).join('')}<small class="muted">Задания и дневной счёт обновляются каждый новый день. Общие достижения остаются с тобой.</small></section>`}

function render(){
 const p=me(), main=document.getElementById('main');
 document.getElementById('syncStatus').textContent=cloud?'● Облако · обновление ~5 сек':'● Локальный режим';
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab));
 if(!p){main.innerHTML=profileSetup();bindSetup();return}
 if(currentTab==='home')main.innerHTML=home(p);
 if(currentTab==='battle')main.innerHTML=battle();
 if(currentTab==='achievements')main.innerHTML=achievements(p);
 if(currentTab==='history')main.innerHTML=historyView();
 bindMain();
}
function profileSetup(){return `<section class="panel"><div class="hero"><div><h1>Добро пожаловать в CLIENT WARS</h1><p>Сначала выбери себе боевой ник и аватар. Регистрация не нужна.</p></div><div class="mascot">🐱</div></div><div class="profileform"><label class="field">Твой никнейм<input id="nick" maxlength="22" placeholder="Например, Профи Продаж"></label><div class="field"><b>Выбери аватар</b><div class="avatars">${AVATARS.map(a=>`<button class="avpick ${a===chosenAvatar?'selected':''}" data-avatar="${a}">${a}</button>`).join('')}</div></div><button class="btn primary" id="createProfile">Войти в битву ⚔️</button><p class="muted small">Профиль запомнится на этом устройстве. Общая комната уже настроена — просто отправь коллегам ссылку на сайт.</p></div></section>`}
function bindSetup(){document.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=()=>{chosenAvatar=b.dataset.avatar;render()});document.getElementById('createProfile').onclick=()=>{let name=document.getElementById('nick').value.trim();if(!name)return alert('Введи никнейм 🙂');if(state.players.length>=10)return alert('Комната заполнена! Максимум — 10 игроков.');let id=crypto.randomUUID?crypto.randomUUID():String(Date.now());state.players.push({id,name,avatar:chosenAvatar,counts:{},created:Date.now()});localStorage.setItem('cw-player',id);addHistory(state.players.at(-1),null,0);save();sync()}}
function home(p){let t=total(p),best=Math.max(0,...Object.values(p.counts)),bestCat=CATS.find(c=>(p.counts[c[0]]||0)===best&&best>0);return `<section class="hero"><div><h1>Йо, ${safe(p.name)}! 😈</h1><p>${titleFor(p)} · Сегодня твой день для великих свершений.</p><div class="paw-divider">🐾 КОТЫ ПРОТИВ ХАОСА 🐾</div></div><div class="mascot">${p.avatar}</div></section>${dailyPanel(p)}<div class="grid"><section class="panel"><h2>📊 Твоя статистика</h2><div class="stats"><div class="stat"><b>${t}</b><span>Всего клиентов</span></div><div class="stat"><b>${dailyTotal(p)}</b><span>За сегодня</span></div><div class="stat"><b>${weeklyTotal(p)}</b><span>За 7 дней</span></div></div><h3>Категории клиентов</h3><div class="cats">${CATS.map(c=>`<div class="cat"><span class="catemoji">${c[1]}</span><span class="catname">${c[2]}</span><span class="count">${p.counts[c[0]]||0}</span><button class="minus" data-change="${c[0]}" data-delta="-1" title="Убавить">−</button><button class="plus" data-change="${c[0]}" data-delta="1" title="Добавить">+</button></div>`).join('')}</div></section><aside class="panel"><h2>🎖️ Твой статус</h2><div class="winner">${p.avatar}</div><h2 style="text-align:center">${safe(titleFor(p))}</h2><p class="muted" style="text-align:center">Каждый клиент приближает тебя к легенде.</p><div class="achievement"><span class="medal">🔥</span><div><b>${streak(p)} очков активности</b><span class="muted small">Счётчик твоих побед</span></div></div><div class="achievement"><span class="medal">👑</span><div><b>${bestCat?bestCat[2]:'Твой путь начинается'}</b><span class="muted small">Самая сильная категория</span></div></div><button class="btn ghost" id="editProfile">✏️ Изменить ник / аватар</button></aside></div>`}
function titleFor(p){let n=total(p);return n>=100?'👑 Легенда продаж':n>=50?'🔥 Гроза клиентов':n>=20?'😎 Уверенный специалист':n>=5?'🛠️ На опыте':'🌱 Новичок арены'}
function streak(p){return total(p)}
function battle(){let ps=[...state.players].sort((a,b)=>total(b)-total(a)),max=Math.max(1,...ps.map(total));let winner=ps.length>1&&total(ps[0])!==total(ps[1])?ps[0]:null;return `<section class="hero"><div><h1>⚔️ БИТВА ЗА КЛИЕНТОВ</h1><p>До 10 игроков. Кто сегодня легенда, а кто просто пришёл спросить?</p></div><div class="mascot">🏆</div></section><section class="panel"><h2>🏆 Таблица лидеров <span class="badge">${ps.length}/10 игроков</span></h2>${ps.length?ps.map((p,i)=>`<div class="playerrow"><div class="avatar">${p.avatar}</div><div class="playerinfo"><b>${i===0?'🥇':i===1?'🥈':'🎮'} ${safe(p.name)}</b><div class="bar"><i style="width:${total(p)/max*100}%"></i></div></div><div class="score">${total(p)}</div></div>`).join(''):'Пока никого нет'}${winner?`<div class="winner">👑 ${safe(winner.name)} впереди!</div>`:ps.length>1?'<p class="muted" style="text-align:center">Ничья! Добавьте клиентов, чтобы вырваться вперёд 😈</p>':'<p class="muted">Позови коллег: пусть откроют ссылку, введут свои ники и подключатся к той же комнате. Вместимость комнаты — до 10 игроков.</p>'}</section><div class="notice">💡 Батл считает сумму всех категорий каждого игрока. Кто больше насчитал — тот сегодня босс.</div>`}
function achievements(p){const defs=[['👑','Король счётчика',10,'Набери 10 клиентов','total'],['📸','Папарацци',10,'10 фотографов','photo'],['🚫','Повелитель игнора',10,'10 игнорщиков','ignore'],['🛒','Интернет-гуру',10,'10 онлайн-покупок','online'],['🐶','Собачий эксперт',5,'5 случаев с собачкой','dog'],['🤝','Мастер благодарности',10,'10 «Спасибо»','thanks'],['🙋','Почётный спрашиватель',10,'10 вопросов','ask'],['🌟','Десятка на табло',100,'Набери 100 клиентов','total'],['⚡','Турбо-день',15,'15 клиентов за день','daily'],['🗓️','Рабочая неделя',50,'50 клиентов за 7 дней','week'],['🎨','Коллекционер хаоса',6,'Попробуй все 6 категорий','all'],['🐾','Лапа удачи',25,'25 клиентов за день','daily25']];return `<section class="panel"><div class="hero"><div><h1>🏆 Зал славы</h1><p>Медали, титулы и немного сомнительной славы.</p></div><div class="mascot">🐱</div></div><div class="stats"><div class="stat"><b>${defs.filter(d=>achievementValue(p,d[4])>=d[2]).length}/${defs.length}</b><span>Открыто медалей</span></div><div class="stat"><b>${total(p)}</b><span>Всего подвигов</span></div><div class="stat"><b>${dailyTotal(p)}</b><span>Сегодняшний улов</span></div></div>${defs.map(d=>{let n=achievementValue(p,d[4]),got=n>=d[2];return `<div class="achievement"><span class="medal">${d[0]}</span><div style="flex:1"><b>${d[1]}</b><span class="muted small">${d[3]}</span><div class="bar"><i style="width:${Math.min(100,n/d[2]*100)}%"></i></div></div><span class="badge">${got?'ОТКРЫТО':Math.min(n,d[2])+'/'+d[2]}</span></div>`}).join('')}</section>`}
function achievementValue(p,k){if(k==='total')return total(p);if(k==='daily'||k==='daily25')return dailyTotal(p);if(k==='week')return weeklyTotal(p);if(k==='all')return CATS.filter(c=>(p.counts[c[0]]||0)>0).length;return p.counts[k]||0}

function historyView(){return `<section class="panel"><h2>📜 История батла</h2>${state.history.length?state.history.map(h=>`<div class="activity"><span class="aicon">${h.avatar||'✨'}</span><div class="atxt"><b>${safe(h.player)}</b><div class="muted small">${safe(h.cat)} ${h.delta?`(${h.delta>0?'+':''}${h.delta})`:''}</div></div><span class="muted small">${new Date(h.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</span></div>`).join(''):'<p class="muted">Пока тихо. Слишком тихо...</p>'}</section>`}
function bindMain(){document.querySelectorAll('[data-change]').forEach(b=>b.onclick=()=>{let p=me(),k=b.dataset.change,d=Number(b.dataset.delta),old=p.counts[k]||0;if(old+d<0)return;p.counts[k]=old+d;let dc=ensureDaily(p);dc[k]=Math.max(0,(dc[k]||0)+d);addHistory(p,CATS.find(c=>c[0]===k),d);save();sync()});let e=document.getElementById('editProfile');if(e)e.onclick=editProfile}
function editProfile(){let p=me();chosenAvatar=p.avatar;document.getElementById('modalRoot').innerHTML=`<div class="modalback"><div class="modal"><h2>Настройки профиля</h2><label class="field">Никнейм<input id="editNick" value="${safe(p.name)}" maxlength="22"></label><p>Аватар</p><div class="avatars">${AVATARS.map(a=>`<button class="avpick ${a===chosenAvatar?'selected':''}" data-editav="${a}">${a}</button>`).join('')}</div><div class="actions"><button class="btn primary" id="saveProfile">Сохранить</button><button class="btn" id="closeModal">Отмена</button></div></div></div>`;document.querySelectorAll('[data-editav]').forEach(b=>b.onclick=()=>{chosenAvatar=b.dataset.editav;document.querySelectorAll('[data-editav]').forEach(x=>x.classList.toggle('selected',x===b))});document.getElementById('closeModal').onclick=()=>document.getElementById('modalRoot').innerHTML='';document.getElementById('saveProfile').onclick=()=>{let n=document.getElementById('editNick').value.trim();if(!n)return alert('Нужен никнейм');p.name=n;p.avatar=chosenAvatar;addHistory(p,null,0);document.getElementById('modalRoot').innerHTML='';save();sync()}}
function settings(){document.getElementById('modalRoot').innerHTML=`<div class="modalback"><div class="modal"><h2>⚙️ Комната и синхронизация</h2><p class="muted">Общая комната уже подключена. Коллегам достаточно открыть сайт, выбрать ник и аватар — настройки вводить не нужно.</p><label class="field">Supabase Project URL<input id="sbUrl" placeholder="https://xxxx.supabase.co" value="${safe(localStorage.getItem('cw-url')||'')}"></label><label class="field">Supabase anon / publishable key<input id="sbKey" placeholder="eyJ..." value="${safe(localStorage.getItem('cw-key')||'')}"></label><label class="field">Код комнаты — придумайте общий код<input id="room" maxlength="40" value="${safe(localStorage.getItem('cw-room')||'client-wars')}"></label><div class="notice">⚠️ Никнеймы не являются защищёнными аккаунтами: любой, кто знает код комнаты, сможет видеть и менять общую статистику. Не используйте личные данные.</div><div class="actions"><button class="btn primary" id="connect">Подключить / сохранить</button><button class="btn" id="closeSettings">Закрыть</button></div><p class="muted small">Код комнаты общий для всех участников: client-wars. Не вводите сюда секретные ключи Supabase.</p></div></div>`;document.getElementById('closeSettings').onclick=()=>document.getElementById('modalRoot').innerHTML='';document.getElementById('connect').onclick=async()=>{localStorage.setItem('cw-url',document.getElementById('sbUrl').value.trim().replace(/\/$/,''));localStorage.setItem('cw-key',document.getElementById('sbKey').value.trim());localStorage.setItem('cw-room',document.getElementById('room').value.trim()||'client-wars');document.getElementById('modalRoot').innerHTML='';await connectCloud()}}
let pollTimer=null;
// Поддерживаем общий облачный источник на всех устройствах.
async function connectCloud(){let url=localStorage.getItem('cw-url'),key=localStorage.getItem('cw-key'),room=localStorage.getItem('cw-room')||'client-wars';if(!url||!key){cloud=null;render();return}try{cloud={url,key,room};let r=await fetch(url+'/rest/v1/rooms?room=eq.'+encodeURIComponent(room)+'&select=state',{headers:{apikey:key,Authorization:'Bearer '+key}});if(!r.ok)throw Error(await r.text());let rows=await r.json();if(rows.length){let remote=rows[0].state||blank();mergeRemote(remote)}else{await cloudWrite()}if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(pollCloud,5000);render()}catch(e){cloud=null;render();alert('Не удалось подключиться. Проверь URL, ключ и SQL из README. '+e.message)}}
let lastPoll=0,pollBusy=false;
async function pollCloud(){if(!cloud||pollBusy)return;pollBusy=true;try{let r=await fetch(cloud.url+'/rest/v1/rooms?room=eq.'+encodeURIComponent(cloud.room)+'&select=state',{headers:{apikey:cloud.key,Authorization:'Bearer '+cloud.key}});if(r.ok){let rows=await r.json();if(rows[0]){let remote=rows[0].state||blank();if(JSON.stringify(remote)!==JSON.stringify(state)){mergeRemote(remote);localStorage.setItem(KEY,JSON.stringify(state));render()}}}}catch(e){}finally{pollBusy=false}}
function mergeRemote(remote){let localId=localStorage.getItem('cw-player');let local=state;let merged={players:remote.players||[],history:remote.history||[]};if(localId&&!merged.players.some(p=>p.id===localId)){let own=local.players.find(p=>p.id===localId);if(own)merged.players.push(own)}state=merged}
async function cloudWrite(){if(!cloud){return}try{let r=await fetch(cloud.url+'/rest/v1/rooms?on_conflict=room',{method:'POST',headers:{apikey:cloud.key,Authorization:'Bearer '+cloud.key,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({room:cloud.room,state})});if(!r.ok)throw Error(await r.text())}catch(e){console.warn(e)}}
let syncTimer;function sync(){if(!cloud)return;clearTimeout(syncTimer);syncTimer=setTimeout(cloudWrite,250)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;render()});document.getElementById('settingsBtn').onclick=settings;
render();
if(localStorage.getItem('cw-url')&&localStorage.getItem('cw-key'))connectCloud();
</script></body></html>
